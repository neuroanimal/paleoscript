# Statyczna wersja Calamusa na GitHub Pages: https://neuroanimal.github.io/paleoscript/
# Buduje draw_script/pages (sam Scriptorium, bez SSR i logowania) i publikuje dist-pages/.
# Wymaga jednorazowo: Settings -> Pages -> Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "draw_script/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: draw_script
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: draw_script/package-lock.json
      # package-lock.json pochodzi z npm 11; npm 10 z Node 22 odrzuca go ("ajv@6.15.0 does not
      # satisfy ajv@8.20.0"), więc instalujemy tą samą wersją npm, którą lockfile powstał
      - run: npx -y npm@11.12.1 ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: draw_script/dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
